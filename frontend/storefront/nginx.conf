# Serves the production build and reverse-proxies /api/ to the API gateway, which routes
# /api/<service>/ to each service, as the Vite dev proxy does. The gateway sends no CORS headers, so
# the browser only ever talks to this origin (and to Keycloak for sign-in).
# Every /api/ request gets a Correlation ID here, before the gateway: the caller's when well-formed
# (the rule the gateway and services apply), nginx's own $request_id otherwise. The gateway keeps
# it, so when the gateway itself is down and nginx answers with its own error page, that page still
# carries the request's ID, and nginx's access line logs it.
map $http_x_correlation_id $correlation_id {
  "~^[A-Za-z0-9-]{1,64}$" $http_x_correlation_id;
  default $request_id;
}

# The ID the browser is told: the gateway's, when it answered, else the one sent to it.
map $upstream_http_x_correlation_id $response_correlation_id {
  "" $correlation_id;
  default $upstream_http_x_correlation_id;
}

log_format api '$remote_addr "$request" $status $body_bytes_sent $request_time correlationId=$response_correlation_id';

server {
  listen 8080;
  root /usr/share/nginx/html;

  # Docker's DNS, asked on each request (a variable upstream), so a recreated gateway container
  # with a new IP is found without restarting nginx.
  resolver 127.0.0.11 valid=10s;

  # nginx compresses only text/html unless told otherwise.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Only to the gateway; it decides what is routed. With a variable and no URI part, proxy_pass
  # sends the request URI on unchanged, /api/ prefix and query included.
  location /api/ {
    set $gateway api-gateway:8080;
    proxy_pass http://$gateway;
    # On the compose network a connection is made at once or not at all; a stopped gateway's cached
    # address would otherwise hold the Customer on a skeleton for a minute per attempt.
    proxy_connect_timeout 3s;
    proxy_set_header X-Correlation-Id $correlation_id;
    # Sent once, on every answer including nginx's own 502 and 504 pages.
    proxy_hide_header X-Correlation-Id;
    add_header X-Correlation-Id $response_correlation_id always;
    access_log /var/log/nginx/access.log api;
  }

  # Hashed assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Product images, at the paths Catalog returns. Their names don't change when they are
  # regenerated, so they are cached for a day rather than forever. A missing image is a 404, not
  # index.html, so the Storefront shows its placeholder.
  location /images/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Every other path is a client-side route.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
