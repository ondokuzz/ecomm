# Serves the production build and reverse-proxies each service at /api/<service>/, the same paths
# the Vite dev proxy serves. The services send no CORS headers, so the browser only ever talks to
# this origin (and to Keycloak for sign-in).
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Docker's DNS, asked on each request (a variable upstream), so a recreated service container
  # with a new IP is found without restarting nginx.
  resolver 127.0.0.11 valid=10s;

  # nginx compresses only text/html unless told otherwise.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location ~ ^/api/(catalog|inventory|cart|checkout-pricing|order-management)(/.*)$ {
    set $service $1;
    proxy_pass http://$service:8080$2$is_args$args;
  }

  # Hashed assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Product images, at the paths Catalog returns. Their names don't change when they are
  # regenerated, so they are cached for a day rather than forever. A missing image is a 404, not
  # index.html, so the Storefront shows its placeholder.
  location /images/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Every other path is a client-side route.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
