# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
spring:
  data:
    redis:
      host: redis
      port: 6379

ecomm:
  support-assistant:
    order-management-url: http://order-management:8080
    fulfillment-shipping-url: http://fulfillment-shipping:8080
    payment-url: http://payment:8080
    returns-warranty-url: http://returns-warranty:8080
  security:
    jwt:
      jwk-set-uri: http://keycloak:8080/realms/ecomm/protocol/openid-connect/certs

# One JSON (ECS) object per line, with the service name and the MDC, including correlationId.
logging:
  structured:
    format:
      console: ecs
