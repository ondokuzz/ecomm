spring:
  application:
    name: promotions
  datasource:
    # POSTGRES_PORT matches the compose override, for when something else holds 5432.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/promotions
    username: ecomm
    password: ecomm

# Catalog on its compose host port, for a Campaign's Categories and currencies.
ecomm:
  promotions:
    catalog-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
