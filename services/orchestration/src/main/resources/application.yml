spring:
  application:
    name: orchestration
  config:
    # Secrets are files, one per property and named after it: the ones Compose mounts in
    # /run/secrets (docs/adr/0011-secrets-as-generated-files.md). There are none outside a container.
    import: optional:configtree:${ecomm.secrets-dir:/run/secrets/}
  temporal:
    namespace: default
    connection:
      # TEMPORAL_PORT matches the compose override, for when something else holds 7233.
      target: localhost:${TEMPORAL_PORT:7233}
    # Each Saga's task queue and the workflows Orchestration runs on it (ADR 0009).
    workers:
      - task-queue: checkout
        workflow-classes:
          - com.ecomm.orchestration.application.CheckoutSaga
        activity-beans:
          - orderActivities
          - paymentActivities
          - inventoryActivities
          - cartActivities
          - checkoutSessionActivities
      - task-queue: fulfillment
        workflow-classes:
          - com.ecomm.orchestration.application.FulfillmentSaga
        activity-beans:
          - shipmentActivities
          - captureActivities
          - orderFulfillmentActivities
  # Order and Shipment events start and wake the fulfillment Saga.
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
  security:
    oauth2:
      client:
        # Orchestration's own identity for the Saga steps' calls (Identity & Access ADR 0002). Its
        # client-secret has no default; compose gives it as a secret.
        registration:
          orchestration:
            provider: keycloak
            client-id: orchestration
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/ecomm/protocol/openid-connect/token

# Every context the Saga's steps call, on its compose host port.
ecomm:
  orchestration:
    # How long the checkout Saga awaits a bank's confirmation of a pending authorization before it
    # voids the Payment and cancels the Order.
    settlement-deadline: 10m
    # How long the fulfillment Saga awaits a shipped Order's delivery before it ends
    # DELIVERY_UNCONFIRMED.
    delivery-deadline: 30d
    # How long a step's call to another context may take to connect and to answer. The read timeout
    # stays under the Sagas' 30 seconds for an attempt (CheckoutSaga.ATTEMPT), so a slow call fails
    # in the worker and its retry replays with the same key.
    connect-timeout: 5s
    read-timeout: 25s
    order-management-url: http://localhost:8085
    payment-url: http://localhost:8084
    inventory-url: http://localhost:8082
    cart-url: http://localhost:8083
    checkout-pricing-url: http://localhost:8086
    fulfillment-shipping-url: http://localhost:8099
