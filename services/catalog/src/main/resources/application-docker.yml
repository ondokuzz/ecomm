# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
spring:
  couchbase:
    connection-string: couchbase://couchbase
  kafka:
    bootstrap-servers: kafka:19092

# Keys come over the internal network; the issuer stays the browser-facing one tokens carry.
ecomm:
  security:
    jwt:
      jwk-set-uri: http://keycloak:8080/realms/ecomm/protocol/openid-connect/certs
  events:
    schema-registry-url: http://apicurio:8080/apis/registry/v3

# One JSON (ECS) object per line, with the service name and the MDC, including correlationId.
logging:
  structured:
    format:
      console: ecs
