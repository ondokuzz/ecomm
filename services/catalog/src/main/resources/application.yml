spring:
  application:
    name: catalog
  config:
    # Secrets are files, one per property and named after it: the ones Compose mounts in
    # /run/secrets (docs/adr/0011-secrets-as-generated-files.md). There are none outside a container.
    import: optional:configtree:${ecomm.secrets-dir:/run/secrets/}
  couchbase:
    connection-string: couchbase://localhost
    # The password is a secret: spring.couchbase.password.
    username: admin
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    producer:
      properties:
        # How long a send waits for a topic's metadata: the outbox relay gives up on a pass after
        # a few of these, so it bounds how long a pass takes while Kafka is down.
        "[max.block.ms]": 10000

ecomm:
  catalog:
    bucket: catalog
    # How long startup waits for the bucket to be ready before it fails. The compose stack waits
    # 5 minutes, as long as Couchbase's own start_period, since a cold Couchbase can take 4.
    bucket-ready-timeout: 60s
    # The local cluster is one node, with no replica to make a write durable on; a production
    # cluster leaves this out and keeps the SDK's MAJORITY.
    transaction-durability: NONE
    # Loaded on startup, only into an empty bucket: Categories first, then their Products.
    seed:
      categories: classpath:seed/categories.json
      products: classpath:seed/products.json
  security:
    # Customers browse the Catalog without logging in; changes still need a Staff token.
    public-read-paths: /products/**, /variants/**, /categories/**, /currencies
  events:
    schema-registry-url: http://localhost:${APICURIO_PORT:8088}/apis/registry/v3
