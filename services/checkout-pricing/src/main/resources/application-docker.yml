# Active inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
spring:
  data:
    redis:
      host: redis
      port: 6379
  temporal:
    connection:
      target: temporal:7233
  security:
    oauth2:
      client:
        provider:
          keycloak:
            # Tokens are fetched over the internal network; they still carry the browser-facing
            # issuer (KC_HOSTNAME), which is the one every service trusts.
            token-uri: http://keycloak:8080/realms/ecomm/protocol/openid-connect/token

ecomm:
  checkout:
    catalog-url: http://catalog:8080
    inventory-url: http://inventory:8080
    cart-url: http://cart:8080
    promotions-url: http://promotions:8080
  security:
    jwt:
      jwk-set-uri: http://keycloak:8080/realms/ecomm/protocol/openid-connect/certs

# One JSON (ECS) object per line, with the service name and the MDC, including correlationId.
logging:
  structured:
    format:
      console: ecs
