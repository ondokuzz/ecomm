spring:
  application:
    name: checkout-pricing
  config:
    # Secrets are files, one per property and named after it: the ones Compose mounts in
    # /run/secrets (docs/adr/0011-secrets-as-generated-files.md). There are none outside a container.
    import: optional:configtree:${ecomm.secrets-dir:/run/secrets/}
  data:
    redis:
      host: localhost
      # REDIS_PORT matches the compose override, for when something else holds 6379.
      port: ${REDIS_PORT:6379}
  # The checkout Saga's Temporal (ADR 0009). TEMPORAL_PORT matches the compose override.
  temporal:
    namespace: default
    connection:
      target: localhost:${TEMPORAL_PORT:7233}
  security:
    oauth2:
      client:
        # Checkout's own identity for Inventory and Promotions (Identity & Access ADR 0002). Its
        # client-secret has no default; compose gives it as a secret.
        registration:
          checkout:
            provider: keycloak
            client-id: checkout
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/ecomm/protocol/openid-connect/token

# Every service on its compose host port.
ecomm:
  checkout:
    catalog-url: http://localhost:8081
    inventory-url: http://localhost:8082
    cart-url: http://localhost:8083
    promotions-url: http://localhost:8087
    # How long paying waits for the Saga's outcome before answering 202.
    saga:
      wait: 10s
