# The ecomm realm's login, registration and error pages, in the Storefront's brand. Only styles:
# the templates, messages and scripts are keycloak.v2's, so a Keycloak upgrade brings its own.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's stylesheet first, then the Storefront's tokens and fonts (generated by the Storefront's
# scripts/keycloak-theme.ts) and the rules that apply them to PatternFly.
styles=css/styles.css css/tokens.css css/fonts.css css/ecomm.css

favIcon=img/favicon.svg
favIconType=image/svg+xml

meta=theme-color==#6a2cf5
