# Checks every pull request and every push to main: the backend, the event schemas' compatibility,
# the secret scan, the Kubernetes manifests, each frontend app, every image, and the Playwright
# suite against the compose stack. On main it also publishes the images to GHCR.
name: CI

# Pushes to other branches aren't checked on their own, so a pull request's commits run once.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same pull request supersedes a running check; main runs them all,
# so every commit on it gets its images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Spotless, unit and Testcontainers tests, and HexagonalRules.
      - run: ./gradlew check

  # Registers the event schemas in a throwaway registry seeded with the schemas from before this
  # change: the tip of the pull request's base branch, or the previous commit on main. The registry refuses a schema
  # that isn't backward compatible, such as a field made required or removed, and the job fails.
  event-schemas:
    runs-on: ubuntu-latest
    services:
      apicurio:
        image: apicurio/apicurio-registry:3.3.3
        ports: ["8088:8080"]
    env:
      REGISTRY_URL: http://localhost:8088/apis/registry/v3
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: timeout 120 sh -c 'until curl -sf "$REGISTRY_URL/system/info" >/dev/null; do sleep 2; done'
      - name: Register the schemas from before this change
        run: |
          # A push that opens a branch has no previous commit; any other missing base is an error,
          # not a reason to skip the check.
          if [ -z "${BASE//0/}" ]; then
            echo "No commit before this change."; exit 0
          fi
          git cat-file -e "$BASE^{commit}"
          if git cat-file -e "$BASE:platform/event-schemas/schemas" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE" platform/event-schemas/schemas | tar -x -C "$RUNNER_TEMP/base"
            SCHEMAS_DIR="$RUNNER_TEMP/base/platform/event-schemas/schemas" platform/event-schemas/register.sh
          else
            echo "No event schemas before this change."
          fi
      - name: Register this change's schemas
        run: platform/event-schemas/register.sh

  # No secret in the repo, its history included, and none in Compose's resolved configuration
  # (docs/adr/0011-secrets-as-generated-files.md). The scan's rules are .gitleaks.toml's, and the
  # known dev placeholders it finds are allow-listed by fingerprint in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the repo and its history for secrets
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          # The history of what is checked out, not of every branch the checkout fetched.
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts=HEAD .
      - run: make secrets
      - name: Check that Compose's resolved configuration holds none of the generated secrets
        run: infra/docker/compose-secrets-check.sh
      - name: Check that every list of the stack's services names each one
        run: python3 -B infra/docker/stack-wiring-check.py

  # The Kubernetes manifests (infra/k8s): the base and every overlay built with Kustomize and
  # validated against Kubernetes' schemas, and the base checked against the Compose file. And the AWS
  # environment's Terraform (infra/terraform), validated and linted. Nothing is applied anywhere.
  k8s:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The version EKS runs the environment on (infra/terraform/environment/variables.tf).
      KUBERNETES_VERSION: 1.35.0
      # The aws overlay's TargetGroupBindings are the Load Balancer Controller's own kind; their
      # schema comes from this catalog, at a fixed commit.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/a6db5a76b3d83fe951f2987085677c6f7fb43501/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      TERRAFORM_IMAGE: hashicorp/terraform:1.17.1
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.65.0
    # Named, so it runs with pipefail: a kustomize build that fails must fail the job, not hand
    # kubeconform nothing to validate.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kustomize.tgz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "$KUSTOMIZE_SHA256  $RUNNER_TEMP/kustomize.tgz" | sha256sum -c -
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kustomize.tgz" -C "$RUNNER_TEMP" kustomize
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build and validate the base and every overlay
        run: |
          for dir in infra/k8s/base infra/k8s/overlays/*/; do
            [ -f "$dir/kustomization.yaml" ] || continue
            echo "== $dir"
            kustomize build --load-restrictor LoadRestrictionsNone "$dir" \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                  -schema-location default -schema-location "$CRD_SCHEMAS"
          done
      - run: make secrets
      - name: Check that every Compose container has its manifest
        run: |
          kustomize build --load-restrictor LoadRestrictionsNone infra/k8s/base \
            | pipx run infra/k8s/compose-parity-check.py
      # Without a backend, so nothing reaches AWS.
      - name: Validate the Terraform
        run: |
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf "$TERRAFORM_IMAGE" fmt -check -recursive -diff
          for root in bootstrap environment; do
            echo "== $root"
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$root" "$TERRAFORM_IMAGE" init -backend=false -input=false
            docker run --rm -v "$PWD/infra/terraform:/tf" -w "/tf/$root" "$TERRAFORM_IMAGE" validate
          done
      - name: Lint the Terraform
        run: |
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf --entrypoint sh "$TFLINT_IMAGE" -c '
            tflint --init --config /tf/.tflint.hcl &&
            tflint --chdir bootstrap --config /tf/.tflint.hcl &&
            tflint --chdir environment --config /tf/.tflint.hcl'

  frontend:
    strategy:
      fail-fast: false
      matrix:
        # Each app under frontend/, by its directory name.
        app: [storefront, admin-console]
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # GHCR repository names must be lowercase.
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: docker compose build
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, tagged with the commit SHA and main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          for image in $(docker compose config --format json | jq -r '.services[] | select(.build) | .image'); do
            docker tag "$image" "${image%:*}:main"
            docker push "$image"
            docker push "${image%:*}:main"
          done

  e2e:
    runs-on: ubuntu-latest
    # Cart abandons a Cart after a minute, looking every 10 seconds, so the Storefront's
    # cart-reminder test, which reads the same variable, sees its reminder within the test. Checkout
    # holds a session for 3 minutes, so the expiry test, which reads it too, waits one out.
    env:
      CART_ABANDONED_AFTER: 1m
      CART_ABANDONMENT_SWEEP: 10s
      CHECKOUT_SESSION_LIFETIME: 3m
    defaults:
      run:
        working-directory: frontend/storefront
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/storefront/package-lock.json
            frontend/admin-console/package-lock.json
      - run: make up
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The Admin Console's suite, against the same stack and with the same Chromium.
      - run: npm ci && npm run test:e2e
        working-directory: frontend/admin-console
      - if: failure()
        run: docker compose logs --no-color --timestamps > compose.log
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            frontend/storefront/playwright-report/
            frontend/storefront/test-results/
            frontend/admin-console/playwright-report/
            frontend/admin-console/test-results/
            compose.log
          if-no-files-found: ignore
