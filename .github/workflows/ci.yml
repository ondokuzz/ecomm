# Checks every pull request and every push to main: the backend, each frontend app, every image,
# and the Playwright suite against the compose stack. On main it also publishes the images to GHCR.
name: CI

# Pushes to other branches aren't checked on their own, so a pull request's commits run once.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same pull request supersedes a running check; main runs them all,
# so every commit on it gets its images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Spotless, unit and Testcontainers tests, and HexagonalRules.
      - run: ./gradlew check

  frontend:
    strategy:
      fail-fast: false
      matrix:
        # Each app under frontend/, by its directory name.
        app: [storefront, admin-console]
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # GHCR repository names must be lowercase.
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: docker compose build
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, tagged with the commit SHA and main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          for image in $(docker compose config --format json | jq -r '.services[] | select(.build) | .image'); do
            docker tag "$image" "${image%:*}:main"
            docker push "$image"
            docker push "${image%:*}:main"
          done

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/storefront
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/storefront/package-lock.json
            frontend/admin-console/package-lock.json
      - run: make up
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The Admin Console's suite, against the same stack and with the same Chromium.
      - run: npm ci && npm run test:e2e
        working-directory: frontend/admin-console
      - if: failure()
        run: docker compose logs --no-color --timestamps > compose.log
        working-directory: .
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            frontend/storefront/playwright-report/
            frontend/storefront/test-results/
            frontend/admin-console/playwright-report/
            frontend/admin-console/test-results/
            compose.log
          if-no-files-found: ignore
