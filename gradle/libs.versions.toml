[versions]
spring-boot = "4.1.1"
spotless = "8.10.2"
archunit = "1.4.2"
wiremock = "3.13.2"
# The release train for the API gateway. 2025.1 targets Boot 4.0; the Boot 4.1 train is still a milestone.
spring-cloud = "2025.1.3"
# The outbox (event publication registry) and its Kafka externalization; 2.1 targets Boot 4.1.
spring-modulith = "2.1.1"
# The schema registry's client: its JSON Schema serializer validates every event on produce.
apicurio-registry = "3.3.3"
# The validator Apicurio's serializer uses, for checking example events against their schemas.
json-schema-validator = "1.5.9"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
apicurio-jsonschema-serde-kafka = { module = "io.apicurio:apicurio-registry-jsonschema-serde-kafka", version.ref = "apicurio-registry" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

# Gradle plugins, consumed as dependencies by build-logic
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
