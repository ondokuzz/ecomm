# Local infrastructure for the whole platform. Credentials here are for local development only.
# Host ports can be overridden (e.g. POSTGRES_PORT=5433) when something else already holds them.
# Couchbase is the exception: its SDK bootstraps from the ports the cluster advertises, so they
# stay fixed.
#
# Built images are named ecomm/<service>:latest; CI sets IMAGE_PREFIX and IMAGE_TAG to build them
# as ghcr.io/<owner>/<repo>/<service>:<commit SHA>.
#
#   docker compose up -d                   # the whole stack

name: ecomm

# What a service that publishes integration events waits for: its topics and their schemas.
x-event-backbone: &event-backbone
  kafka-topics: { condition: service_completed_successfully }
  schema-registry-init: { condition: service_completed_successfully }

# Every Spring service: a JVM capped at 384 MB, of which its image gives 60% to the heap
# (-XX:MaxRAMPercentage=60), and healthy once its actuator says UP.
x-spring-service: &spring-service
  mem_limit: 384m
  healthcheck:
    # The JRE image has no curl, and its sh has no /dev/tcp; talk HTTP over bash's.
    test:
      - CMD
      - bash
      - -c
      - >-
        exec 3<>/dev/tcp/localhost/8080 &&
        printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"status":"UP"' <&3
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 20s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ecomm
      POSTGRES_PASSWORD: ecomm
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ecomm -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A browser UI for the shared Postgres on http://localhost:5050, signed in and already connected
  # as ecomm to every service's database. Desktop mode: no pgAdmin login, and no volume, so it
  # starts afresh from pgadmin/ each time. Not in the default stack; `docker compose up -d pgadmin`
  # starts it.
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [tools]
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Required by the image even in desktop mode, where nobody signs in with them.
      PGADMIN_DEFAULT_EMAIL: admin@ecomm.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin/servers.json
      PGPASS_FILE: /pgadmin/pgpass
    mem_limit: 384m
    ports: ["${PGADMIN_PORT:-5050}:80"]
    volumes:
      - ./pgadmin:/pgadmin:ro
    depends_on:
      postgres: { condition: service_healthy }

  # Creates each service's database that doesn't exist yet, then exits; see the script.
  postgres-databases:
    image: postgres:16
    entrypoint: ["/init/postgres-databases.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ecomm
      PGPASSWORD: ecomm
      PGDATABASE: postgres
    volumes:
      - ./postgres-databases.sh:/init/postgres-databases.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # Imports the ecomm realm on first start; an existing realm is left alone, so after changing
    # the realm file, delete the realm (or the postgres-data volume) to re-import it.
    command: ["start-dev", "--import-realm"]
    environment:
      # Tokens carry this browser-facing issuer; services fetch keys from keycloak:8080 instead.
      KC_HOSTNAME: http://localhost:8180
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ecomm
      KC_DB_PASSWORD: ecomm
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The same heap share as the Spring services. Keycloak starts in their 384 MB but sits at the
      # limit, so it gets a little more.
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30
    mem_limit: 512m
    ports: ["${KEYCLOAK_PORT:-8180}:8080"]
    volumes:
      - ../../services/identity-access/realm:/opt/keycloak/data/import:ro
      # The ecomm realm's login theme. start-dev doesn't cache themes, so edits show on reload.
      - ../../services/identity-access/themes/ecomm:/opt/keycloak/themes/ecomm:ro
    depends_on:
      postgres-databases: { condition: service_completed_successfully }
    healthcheck:
      # The image has no curl; talk HTTP to the management port over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  couchbase:
    image: couchbase:community-7.6.2
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8091/ui/index.html"]
      interval: 5s
      timeout: 3s
      retries: 30

  couchbase-init:
    image: couchbase:community-7.6.2
    entrypoint: ["/init/couchbase-init.sh"]
    environment:
      COUCHBASE_USERNAME: admin
      COUCHBASE_PASSWORD: password
      COUCHBASE_BUCKET: catalog
    volumes:
      - ./couchbase-init.sh:/init/couchbase-init.sh:ro
    depends_on:
      couchbase: { condition: service_healthy }
    restart: "no"

  catalog:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/catalog:${IMAGE_TAG:-latest}
    ports: ["${CATALOG_PORT:-8081}:8080"]
    depends_on:
      <<: *event-backbone
      couchbase-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  inventory:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/inventory/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/inventory:${IMAGE_TAG:-latest}
    ports: ["${INVENTORY_PORT:-8082}:8080"]
    depends_on:
      <<: *event-backbone
      postgres-databases: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  cart:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/cart/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/cart:${IMAGE_TAG:-latest}
    ports: ["${CART_PORT:-8083}:8080"]
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  payment:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/payment/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/payment:${IMAGE_TAG:-latest}
    ports: ["${PAYMENT_PORT:-8084}:8080"]
    depends_on:
      postgres-databases: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  order-management:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/order-management/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/order-management:${IMAGE_TAG:-latest}
    ports: ["${ORDER_MANAGEMENT_PORT:-8085}:8080"]
    depends_on:
      <<: *event-backbone
      postgres-databases: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  promotions:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/promotions/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/promotions:${IMAGE_TAG:-latest}
    ports: ["${PROMOTIONS_PORT:-8087}:8080"]
    depends_on:
      postgres-databases: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  # A read projection over Catalog's and Inventory's events, in Mongo's search database. It only
  # consumes, so it waits for the topics but not for their schemas.
  search-discovery:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/search-discovery/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/search-discovery:${IMAGE_TAG:-latest}
    ports: ["${SEARCH_DISCOVERY_PORT:-8089}:8080"]
    depends_on:
      kafka-topics: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  checkout-pricing:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: services/checkout-pricing/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/checkout-pricing:${IMAGE_TAG:-latest}
    ports: ["${CHECKOUT_PRICING_PORT:-8086}:8080"]
    environment:
      # Checkout's own client in the ecomm realm (Identity & Access ADR 0002); dev-only, like the
      # value in the realm file.
      CHECKOUT_CLIENT_SECRET: checkout-dev-secret
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      cart: { condition: service_healthy }
      payment: { condition: service_healthy }
      order-management: { condition: service_healthy }
      promotions: { condition: service_healthy }

  # The one way in for browsers: authenticates at the edge and routes /api/<service>/** to the
  # services (platform/api-gateway). The services' own host ports above bypass it, for development.
  api-gateway:
    <<: *spring-service
    build:
      context: ../..
      dockerfile: platform/api-gateway/Dockerfile
    image: ${IMAGE_PREFIX:-ecomm}/api-gateway:${IMAGE_TAG:-latest}
    ports: ["${API_GATEWAY_PORT:-8000}:8080"]
    depends_on:
      keycloak: { condition: service_healthy }
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      cart: { condition: service_healthy }
      order-management: { condition: service_healthy }
      checkout-pricing: { condition: service_healthy }
      promotions: { condition: service_healthy }
      search-discovery: { condition: service_healthy }

  storefront:
    build:
      context: ../../frontend/storefront
    image: ${IMAGE_PREFIX:-ecomm}/storefront:${IMAGE_TAG:-latest}
    # Fixed: http://localhost:8080 is one of the storefront client's redirect origins in the realm
    # file, so login breaks on any other port.
    ports: ["8080:8080"]
    mem_limit: 64m
    depends_on:
      keycloak: { condition: service_healthy }
      api-gateway: { condition: service_healthy }
    healthcheck:
      # nginx listens on IPv4 only, and localhost resolves to ::1 first.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin-console:
    build:
      context: ../../frontend/admin-console
    image: ${IMAGE_PREFIX:-ecomm}/admin-console:${IMAGE_TAG:-latest}
    # Fixed: http://localhost:8090 is one of the admin-console client's redirect origins in the
    # realm file, so login breaks on any other port.
    ports: ["8090:8090"]
    mem_limit: 64m
    depends_on:
      keycloak: { condition: service_healthy }
      api-gateway: { condition: service_healthy }
    healthcheck:
      # nginx listens on IPv4 only, and localhost resolves to ::1 first.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The event backbone (ADR 0006): one KRaft broker. Services reach it on kafka:19092, the host on
  # localhost:9092. It creates no topics itself; kafka-topics does.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: ecomm-local-kafka-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    mem_limit: 512m
    ports: ["${KAFKA_PORT:-9092}:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Creates a topic per event schema, then exits; see the script.
  kafka-topics:
    image: apache/kafka:4.3.1
    entrypoint: ["/init/kafka-topics.sh"]
    mem_limit: 256m
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ./kafka-topics.sh:/init/kafka-topics.sh:ro
      - ../../platform/event-schemas/schemas:/schemas:ro
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  # The events' schema registry, stored in its own database on the shared Postgres. Its UI isn't
  # part of the stack; browse the API at http://localhost:8088/apis/registry/v3.
  apicurio:
    image: apicurio/apicurio-registry:3.3.3
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: ecomm
      APICURIO_DATASOURCE_PASSWORD: ecomm
      # The image gives the heap 80%; leave the same headroom as the Spring services.
      JAVA_OPTS_APPEND: -XX:MaxRAMPercentage=60
    mem_limit: 384m
    ports: ["${APICURIO_PORT:-8088}:8080"]
    depends_on:
      postgres-databases: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Registers every event schema in platform/event-schemas with BACKWARD compatibility, then exits.
  # It fails, and so does `make up`, if a schema changed incompatibly since it was last registered.
  schema-registry-init:
    image: curlimages/curl:8.22.0
    entrypoint: ["/schemas/register.sh"]
    mem_limit: 32m
    environment:
      REGISTRY_URL: http://apicurio:8080/apis/registry/v3
    volumes:
      - ../../platform/event-schemas:/schemas:ro
    depends_on:
      apicurio: { condition: service_healthy }
    restart: "no"

  mongo:
    image: mongo:7
    # WiredTiger's cache would otherwise take half the memory the VM has, beyond the cap.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  couchbase-data:
  kafka-data:
  mongo-data:
