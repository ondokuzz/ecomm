# Registers every event schema with BACKWARD compatibility, then exits
# (platform/event-schemas/register.sh). It fails, and keeps failing, if a schema changed
# incompatibly since it was last registered.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-registry-init
  labels:
    app.kubernetes.io/name: schema-registry-init
    app.kubernetes.io/component: init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry-init
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-registry-init
          image: curlimages/curl:8.22.0
          command: ["/schemas/register.sh"]
          env:
            - { name: REGISTRY_URL, value: "http://apicurio:8080/apis/registry/v3" }
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: register
              mountPath: /schemas/register.sh
              subPath: register.sh
              readOnly: true
            - name: event-schemas
              mountPath: /schemas/schemas
              readOnly: true
      volumes:
        - name: register
          configMap:
            name: schema-registry-init
            defaultMode: 0555
        - name: event-schemas
          configMap:
            name: event-schemas
