# Loads the seed Categories and Products into an empty catalog bucket, or gives seeded Products the
# seed's Warranty terms, then exits: what Catalog does as it starts in Compose, run once here so its
# two replicas don't both seed (com.ecomm.catalog.CatalogSeed). The events it writes to the Outbox
# are sent by whichever relay runs first, the Job's own before it exits or the replicas'.
# Inventory's and Promotions' seed are their own migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed
  labels:
    app.kubernetes.io/name: catalog-seed
    app.kubernetes.io/component: init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-seed
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: catalog-seed
          image: ecomm/catalog:latest
          command:
            - java
            - -Dloader.main=com.ecomm.catalog.CatalogSeed
            - org.springframework.boot.loader.launch.PropertiesLauncher
          envFrom:
            - configMapRef:
                name: spring-service
          env:
            - { name: ECOMM_CATALOG_BUCKET_READY_TIMEOUT, value: 5m }
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: couchbase-password
                  items:
                    - key: couchbase-password
                      path: spring.couchbase.password
