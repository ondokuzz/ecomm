# The events' schema registry, stored in its own database on the shared Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio
    spec:
      containers:
        - name: apicurio
          image: apicurio/apicurio-registry:3.3.3
          # The registry reads its database password from its environment, so it is read from the
          # secret's file into it as the registry starts.
          args:
            - sh
            - -c
            - APICURIO_DATASOURCE_PASSWORD="$$(cat /run/secrets/postgres-password)" exec /opt/jboss/container/java/run/run-java.sh
          env:
            - { name: APICURIO_STORAGE_KIND, value: sql }
            - { name: APICURIO_STORAGE_SQL_KIND, value: postgresql }
            - { name: APICURIO_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/apicurio" }
            - { name: APICURIO_DATASOURCE_USERNAME, value: ecomm }
            - { name: JAVA_OPTS_APPEND, value: -XX:MaxRAMPercentage=60 }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
spec:
  selector:
    app.kubernetes.io/name: apicurio
  ports:
    - { name: http, port: 8080, targetPort: http }
