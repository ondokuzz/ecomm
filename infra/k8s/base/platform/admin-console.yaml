# The Admin Console: nginx serving the build and sending /api/ to the gateway, named in full as
# for the Storefront (storefront.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console
  labels:
    app.kubernetes.io/name: admin-console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-console
    spec:
      containers:
        - name: admin-console
          image: ecomm/admin-console:latest
          env:
            - { name: API_GATEWAY, value: "api-gateway.ecomm.svc.cluster.local:8080" }
          ports:
            - { name: http, containerPort: 8090 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-console
spec:
  selector:
    app.kubernetes.io/name: admin-console
  ports:
    - { name: http, port: 8090, targetPort: http }
