# Temporal's web UI, for following workflows and their retries; reached by port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  labels:
    app.kubernetes.io/name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
    spec:
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.55.0
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
spec:
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - { name: http, port: 8080, targetPort: http }
