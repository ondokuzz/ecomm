# The Sagas' runtime (ADR 0009), persisting to the shared Postgres in its temporal and
# temporal_visibility databases. Workers and clients reach it on temporal:7233.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/server:1.32.0
          # The server reads its database password from its environment, so it is read from the
          # secret's file into it as the server starts.
          args:
            - sh
            - -c
            - POSTGRES_PWD="$$(cat /run/secrets/postgres-password)" exec /etc/temporal/entrypoint.sh
          env:
            - { name: DB, value: postgres12 }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: ecomm }
            - { name: BIND_ON_IP, value: 0.0.0.0 }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: /etc/temporal/dynamicconfig.yaml }
            - { name: SQL_MAX_CONNS, value: "10" }
            - { name: SQL_MAX_IDLE_CONNS, value: "5" }
            - { name: SQL_VIS_MAX_CONNS, value: "5" }
            - { name: SQL_VIS_MAX_IDLE_CONNS, value: "2" }
            - { name: GOMEMLIMIT, value: 300MiB }
          ports:
            - { name: grpc, containerPort: 7233 }
            - { name: http, containerPort: 7243 }
          startupProbe:
            httpGet: { path: /api/v1/cluster-info, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/v1/cluster-info, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: dynamicconfig
              mountPath: /etc/temporal/dynamicconfig.yaml
              subPath: temporal-dynamicconfig.yaml
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
        - name: dynamicconfig
          configMap:
            name: temporal-dynamicconfig
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - { name: grpc, port: 7233, targetPort: grpc }
