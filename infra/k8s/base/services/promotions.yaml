# Coupons and Campaigns, in Postgres's promotions database.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotions
  labels:
    app.kubernetes.io/name: promotions
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: promotions
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotions
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: promotions
          image: ecomm/promotions:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
                  items:
                    - key: postgres-password
                      path: spring.datasource.password
---
apiVersion: v1
kind: Service
metadata:
  name: promotions
spec:
  selector:
    app.kubernetes.io/name: promotions
  ports:
    - name: http
      port: 8080
      targetPort: http
