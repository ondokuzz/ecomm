# Customers' messages and Cart reminders, sent to Mailpit over SMTP.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: notifications
          image: ecomm/notifications:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
                  items:
                    - key: postgres-password
                      path: spring.datasource.password
              - secret:
                  name: notifications-client-secret
                  items:
                    - key: notifications-client-secret
                      path: spring.security.oauth2.client.registration.notifications.client-secret
              - secret:
                  name: notifications-unsubscribe-key
                  items:
                    - key: notifications-unsubscribe-key
                      path: ecomm.notifications.unsubscribe.key
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  selector:
    app.kubernetes.io/name: notifications
  ports:
    - name: http
      port: 8080
      targetPort: http
