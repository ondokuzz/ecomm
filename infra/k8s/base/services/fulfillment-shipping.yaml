# Shipping quotes and Shipments, with the mock carrier's signed Carrier webhooks.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-shipping
  labels:
    app.kubernetes.io/name: fulfillment-shipping
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillment-shipping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillment-shipping
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: fulfillment-shipping
          image: ecomm/fulfillment-shipping:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
                  items:
                    - key: postgres-password
                      path: spring.datasource.password
              - secret:
                  name: carrier-webhook-secret
                  items:
                    - key: carrier-webhook-secret
                      path: ecomm.fulfillment-shipping.carrier-webhooks.secret
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillment-shipping
spec:
  selector:
    app.kubernetes.io/name: fulfillment-shipping
  ports:
    - name: http
      port: 8080
      targetPort: http
