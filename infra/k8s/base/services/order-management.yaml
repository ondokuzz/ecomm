# Orders and their Order Status history, in Postgres's orders database.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  labels:
    app.kubernetes.io/name: order-management
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-management
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: order-management
          image: ecomm/order-management:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
                  items:
                    - key: postgres-password
                      path: spring.datasource.password
---
apiVersion: v1
kind: Service
metadata:
  name: order-management
spec:
  selector:
    app.kubernetes.io/name: order-management
  ports:
    - name: http
      port: 8080
      targetPort: http
