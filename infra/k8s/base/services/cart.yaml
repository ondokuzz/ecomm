# Carts in Redis, and the sweep that abandons an unchanged one.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: cart
          image: ecomm/cart:latest
          env:
            - name: ECOMM_CART_ABANDONED_AFTER
              value: 24h
            - name: ECOMM_CART_ABANDONMENT_SWEEP
              value: 5m
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart
spec:
  selector:
    app.kubernetes.io/name: cart
  ports:
    - name: http
      port: 8080
      targetPort: http
