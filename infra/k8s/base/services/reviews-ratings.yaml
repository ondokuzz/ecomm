# Verified-purchase reviews, in Mongo's reviews database.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-ratings
  labels:
    app.kubernetes.io/name: reviews-ratings
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reviews-ratings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reviews-ratings
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: reviews-ratings
          image: ecomm/reviews-ratings:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-ratings
spec:
  selector:
    app.kubernetes.io/name: reviews-ratings
  ports:
    - name: http
      port: 8080
      targetPort: http
