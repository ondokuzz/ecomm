# Checkout Sessions in Redis; paying starts the checkout Saga on Temporal.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-pricing
  labels:
    app.kubernetes.io/name: checkout-pricing
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-pricing
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: checkout-pricing
          image: ecomm/checkout-pricing:latest
          env:
            - name: ECOMM_CHECKOUT_SESSION_LIFETIME
              value: 15m
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: checkout-client-secret
                  items:
                    - key: checkout-client-secret
                      path: spring.security.oauth2.client.registration.checkout.client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-pricing
spec:
  selector:
    app.kubernetes.io/name: checkout-pricing
  ports:
    - name: http
      port: 8080
      targetPort: http
