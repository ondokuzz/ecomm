# The Temporal worker for every Saga: two workers. Its cap and heap share are Compose's (see
# infra/docker/compose.yaml for why).
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration
  labels:
    app.kubernetes.io/name: orchestration
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestration
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: orchestration
          image: ecomm/orchestration:latest
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=45 -XX:TieredStopAtLevel=1 -Xss512k
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: orchestration-client-secret
                  items:
                    - key: orchestration-client-secret
                      path: spring.security.oauth2.client.registration.orchestration.client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration
spec:
  selector:
    app.kubernetes.io/name: orchestration
  ports:
    - name: http
      port: 8080
      targetPort: http
