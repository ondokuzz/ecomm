# A read projection over Catalog's and Inventory's events, in Mongo's search database.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-discovery
  labels:
    app.kubernetes.io/name: search-discovery
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: search-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-discovery
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: search-discovery
          image: ecomm/search-discovery:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: search-discovery
spec:
  selector:
    app.kubernetes.io/name: search-discovery
  ports:
    - name: http
      port: 8080
      targetPort: http
