# The Support Assistant. With the secret anthropic-api-key empty, the mock provider answers.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-support-assistant
  labels:
    app.kubernetes.io/name: ai-support-assistant
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-support-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-support-assistant
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: ai-support-assistant
          image: ecomm/ai-support-assistant:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: anthropic-api-key
                  items:
                    - key: anthropic-api-key
                      path: ecomm.support-assistant.anthropic-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: ai-support-assistant
spec:
  selector:
    app.kubernetes.io/name: ai-support-assistant
  ports:
    - name: http
      port: 8080
      targetPort: http
