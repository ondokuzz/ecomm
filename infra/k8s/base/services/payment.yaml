# Payments, with the mock gateway's signed webhooks, in Postgres's payment database.
# Probes, the shared JVM options and port 8080 come from patches/spring-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/component: spring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/component: spring-service
    spec:
      containers:
        - name: payment
          image: ecomm/payment:latest
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: postgres-password
                  items:
                    - key: postgres-password
                      path: spring.datasource.password
              - secret:
                  name: payment-webhook-secret
                  items:
                    - key: payment-webhook-secret
                      path: payment.webhooks.secret
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app.kubernetes.io/name: payment
  ports:
    - name: http
      port: 8080
      targetPort: http
