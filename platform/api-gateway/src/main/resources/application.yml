spring:
  application:
    name: api-gateway

# The routed services, at /api/<name>/**. The URIs are the services' dev host ports;
# application-docker.yml points them at the compose network. Every other method and path under a
# service's prefix needs a token, except its public reads and webhooks; internal endpoints get a 404.
ecomm:
  gateway:
    services:
      catalog:
        uri: http://localhost:8081
        public-reads: [/products/**, /variants/**, /categories/**, /currencies]
      inventory:
        uri: http://localhost:8082
        public-reads: [/stock, /stock/*]
        # /stock/decrement is gone from Inventory, and stays unrouted.
        internal: [/stock/decrement, /reservations/**]
      cart:
        uri: http://localhost:8083
        # Only Orchestration clears a named Customer's Cart.
        internal: [/carts/**]
      checkout-pricing:
        uri: http://localhost:8086
        # Only Orchestration ends a named Customer's Checkout Session.
        internal: [POST /checkout/sessions/*/end]
      order-management:
        uri: http://localhost:8085
        internal: [POST /orders, PATCH /orders/*/status]
      payment:
        uri: http://localhost:8084
        # The Customer's and Staff's reads are routed; only Orchestration authorizes, voids,
        # captures and refunds, and reads a named Customer's Payment, or their Payments by Order.
        internal:
          [POST /payments, POST /payments/*/void, POST /payments/*/capture, POST /payments/*/refunds,
           GET /payments/by-order, GET /payments/*/for-customer]
        # The payment gateway settles pending authorizations from outside; Payment checks the
        # webhook's signature.
        webhooks: [POST /webhooks/gateway]
      promotions:
        uri: http://localhost:8087
        # Only Checkout evaluates Coupons, so nobody can probe codes from outside a checkout.
        internal: [/discounts/**]
      search-discovery:
        uri: http://localhost:8089
        public-reads: [/search]
      reviews-ratings:
        uri: http://localhost:8097
        public-reads: [/products/*/reviews, /products/*/rating-summary, /rating-summaries]
      recommendations:
        uri: http://localhost:8098
        public-reads: [/products/*/also-bought]
      fulfillment-shipping:
        uri: http://localhost:8099
        # Only Checkout asks for Shipping quotes, for a Checkout Session's address, and only the
        # fulfillment Saga creates, dispatches and holds Shipments, and the returns Saga creates and
        # dispatches replacements. Staff pick, pack and read them, and a Customer reads their own,
        # and any Warehouse's return address.
        internal: [/shipping/**, POST /shipments, POST /shipments/*/dispatch, POST /shipments/*/hold]
        # The Carrier reports Tracking events from outside; the service checks the signature.
        webhooks: [POST /webhooks/carrier]
      returns-warranty:
        uri: http://localhost:8100
        # Customers request and read their own RMAs, and ask what their Orders are eligible for;
        # Staff decide, receive, inspect and read any. Only the returns Saga resolves, holds and
        # expires them.
        internal: [POST /rmas/*/resolve, POST /rmas/*/hold, POST /rmas/*/expire]
      notifications:
        uri: http://localhost:8101
        # Staff read the Notification ledger and preview the Message templates; a Customer reads
        # their own Notifications. Nothing is internal.

# Plain-text logs name the Correlation ID too, so the access log reads the same outside Docker.
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
